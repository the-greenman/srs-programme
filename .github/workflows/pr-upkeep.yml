name: PR upkeep

# Every 15 minutes: merge green `gate:auto-merge` PRs and keep gated PRs up to date with
# their base across the estate. Once a day (first run after 07:00 UTC) it also posts the owner's
# review digest on semanticops.com#33. See scripts/pr-upkeep.sh (srs-programme#39).
# Needs BOARD_TOKEN (repo scope on every listed repo).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Act (false = dry run)"
        type: boolean
        default: false
      digest:
        description: "Post the digest"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pr-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upkeep
        env:
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
          APPLY: ${{ inputs.apply }}
          DIGEST: ${{ inputs.digest }}
        run: |
          args=()
          if [ "$IS_SCHEDULE" = true ] || [ "$APPLY" = true ]; then args+=(--apply); fi
          if { [ "$IS_SCHEDULE" = true ] && [ "$(date -u +%H)" = 07 ] && [ "$(date -u +%M)" -lt 15 ]; } || [ "$DIGEST" = true ]; then args+=(--digest); fi
          bash scripts/pr-upkeep.sh "${args[@]}"
