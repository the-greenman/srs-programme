name: Board sync

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"   # hourly: promote intents and reconcile (UTC)
  workflow_dispatch:

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  board-sync:
    uses: the-greenman/clerk/.github/workflows/programme-board-sync.yml@a733ff161aa2bd161fbee4988d5a871339e4753c
    with:
      clerk-ref: a733ff161aa2bd161fbee4988d5a871339e4753c
    secrets: inherit
