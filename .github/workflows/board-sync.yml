name: Board sync

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"   # hourly: promote intents and reconcile (UTC)
  workflow_dispatch:

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
