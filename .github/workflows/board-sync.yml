name: Board sync

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"   # hourly: promote intents and reconcile (UTC)
  workflow_dispatch:

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  board-sync:
    uses: the-greenman/clerk/.github/workflows/programme-board-sync.yml@beeae91222ef6e6e854a42b8d5071a246910b0e2
    with:
      clerk-ref: beeae91222ef6e6e854a42b8d5071a246910b0e2
    secrets: inherit
