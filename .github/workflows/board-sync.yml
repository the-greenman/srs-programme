    uses: the-greenman/clerk/.github/workflows/programme-board-sync.yml@89fdcd9be3141d35ada06f7dc9bbe5ef202c133b
    with:
      clerk-ref: 89fdcd9be3141d35ada06f7dc9bbe5ef202c133b
    secrets: inherit
