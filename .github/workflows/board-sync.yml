name: Board sync

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"   # hourly: promote intents and reconcile (UTC)
  workflow_dispatch:

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  board-sync:
    uses: the-greenman/clerk/.github/workflows/programme-board-sync.yml@09fbbc1abfbe6b5411905328dba6b4d3cd098824
    with:
      clerk-ref: 09fbbc1abfbe6b5411905328dba6b4d3cd098824
    secrets: inherit
