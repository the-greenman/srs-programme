name: Board sync

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"   # hourly: promote intents and reconcile (UTC)
  workflow_dispatch:

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  board-sync:
    uses: the-greenman/clerk/.github/workflows/programme-board-sync.yml@c4e5f049b9584a51f5109104d6ff6b9bb4019885
    with:
      clerk-ref: c4e5f049b9584a51f5109104d6ff6b9bb4019885
    secrets: inherit
