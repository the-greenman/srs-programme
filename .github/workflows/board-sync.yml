name: Board sync

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"   # hourly: promote intents and reconcile (UTC)
  workflow_dispatch:

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  board-sync:
    uses: the-greenman/clerk/.github/workflows/programme-board-sync.yml@906295f5e1e1f4d8f4ca4a97c6bd77f990376595
    with:
      clerk-ref: 906295f5e1e1f4d8f4ca4a97c6bd77f990376595
    secrets: inherit
