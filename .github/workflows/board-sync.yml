name: Board sync

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"   # hourly: promote intents and reconcile (UTC)
  workflow_dispatch:

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  board-sync:
    uses: the-greenman/clerk/.github/workflows/programme-board-sync.yml@0d71f66cec6a72b8a8a8167ce26a2e39b2f4bfb6
    with:
      clerk-ref: 0d71f66cec6a72b8a8a8167ce26a2e39b2f4bfb6
    secrets: inherit
