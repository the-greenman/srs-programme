name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@9400818a053e9da057ca0ca3874efc581c87b9eb
    with:
      clerk-ref: 9400818a053e9da057ca0ca3874efc581c87b9eb
