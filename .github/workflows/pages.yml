name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@bc668ee16349ac52e358e2e2e158019d931454f6
    with:
      clerk-ref: bc668ee16349ac52e358e2e2e158019d931454f6
