name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@46ddc9f669bedc61092da86f545af698f55f9fa0
    with:
      clerk-ref: 46ddc9f669bedc61092da86f545af698f55f9fa0
