name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@beeae91222ef6e6e854a42b8d5071a246910b0e2
    with:
      clerk-ref: beeae91222ef6e6e854a42b8d5071a246910b0e2
