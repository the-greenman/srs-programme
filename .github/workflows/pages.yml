name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@906295f5e1e1f4d8f4ca4a97c6bd77f990376595
    with:
      clerk-ref: 906295f5e1e1f4d8f4ca4a97c6bd77f990376595
