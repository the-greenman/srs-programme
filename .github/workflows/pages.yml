name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@c4e5f049b9584a51f5109104d6ff6b9bb4019885
    with:
      clerk-ref: c4e5f049b9584a51f5109104d6ff6b9bb4019885
