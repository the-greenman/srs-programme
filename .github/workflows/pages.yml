name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@4df53e17923390fae3da1d6dbd2ae90262a78ace
    with:
      clerk-ref: 4df53e17923390fae3da1d6dbd2ae90262a78ace
