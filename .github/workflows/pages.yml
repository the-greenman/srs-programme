name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@336b67fb88a046e30d8d32d61875ffacd1783b4d
    with:
      clerk-ref: 336b67fb88a046e30d8d32d61875ffacd1783b4d
