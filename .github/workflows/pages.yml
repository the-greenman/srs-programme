name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@2d9a6e5c430632bf56939b718b2b4cbf714c61e2
    with:
      clerk-ref: 2d9a6e5c430632bf56939b718b2b4cbf714c61e2
