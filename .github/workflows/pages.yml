name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@0d71f66cec6a72b8a8a8167ce26a2e39b2f4bfb6
    with:
      clerk-ref: 0d71f66cec6a72b8a8a8167ce26a2e39b2f4bfb6
