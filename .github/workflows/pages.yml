name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@89fdcd9be3141d35ada06f7dc9bbe5ef202c133b
    with:
      clerk-ref: 89fdcd9be3141d35ada06f7dc9bbe5ef202c133b
