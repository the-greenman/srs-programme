name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The called workflow needs these; a caller must grant at least what the callee asks for.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: the-greenman/clerk/.github/workflows/programme-pages.yml@a733ff161aa2bd161fbee4988d5a871339e4753c
    with:
      clerk-ref: a733ff161aa2bd161fbee4988d5a871339e4753c
