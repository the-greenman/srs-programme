name: Validate

# Thin caller. The gate lives in the clerk. Bump a733ff161aa2bd161fbee4988d5a871339e4753c in every programme workflow together
# (it appears twice per file: in uses: and in clerk-ref).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  # The pinned srs-rust release supplying the srs CLI. Declared once, here; `clerk fetch-srs` reads it.
  # Advance it in its own commit, stating why.
  SRS_RUST_CLI_TAG: v0.1.0-build.502

jobs:
  validate:
    uses: the-greenman/clerk/.github/workflows/programme-validate.yml@a733ff161aa2bd161fbee4988d5a871339e4753c
    with:
      clerk-ref: a733ff161aa2bd161fbee4988d5a871339e4753c
