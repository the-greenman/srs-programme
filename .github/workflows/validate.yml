name: Validate

# Thin caller. The gate lives in the clerk. Bump 0d71f66cec6a72b8a8a8167ce26a2e39b2f4bfb6 in every programme workflow together
# (it appears twice per file: in uses: and in clerk-ref).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  # The pinned srs-rust release supplying the srs CLI. Declared once, here; `clerk fetch-srs` reads it.
  # Advance it in its own commit, stating why.
  SRS_RUST_CLI_TAG: v0.1.0-build.554

jobs:
  validate:
    uses: the-greenman/clerk/.github/workflows/programme-validate.yml@89fdcd9be3141d35ada06f7dc9bbe5ef202c133b
    with:
      clerk-ref: 89fdcd9be3141d35ada06f7dc9bbe5ef202c133b
